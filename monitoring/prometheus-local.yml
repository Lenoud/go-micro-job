global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: "api-gateway"
    static_configs:
      - targets: ["host.docker.internal:6060"]

  - job_name: "user-service"
    static_configs:
      - targets: ["host.docker.internal:6061"]

  - job_name: "department-service"
    static_configs:
      - targets: ["host.docker.internal:6062"]

  - job_name: "oplog-service"
    static_configs:
      - targets: ["host.docker.internal:6063"]

  - job_name: "monolith"
    static_configs:
      - targets: ["host.docker.internal:6070"]
